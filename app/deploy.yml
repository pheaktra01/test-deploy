---
- name: Deploy React App Using Docker Compose
  hosts: webservers
  become:: true

  tasks:
    - name: Update apt package
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose
          - git
        state: present

    - name: Start Docker service
      servive:
        name: docker
        state: started
        enabled: yes

    - name: Add yagami to docker group
      user: 
        name: yagami
        groups: docker
        append: yes

    - name: Copy project file to server
      copy:
        src: ./
        dest:: /home/yagami/react-app/
        mode: 0755

    - name: Run Docker Compose build & up
      shell: |
        cd /home/yagami/react-app/
        docker compose down || true
        docker-compose up -d --build